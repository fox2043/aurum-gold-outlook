name: Refresh CMB gold quote

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh CMB quote when the official endpoint is reachable
        run: node scripts/refresh-cmb-gold.js || echo "CMB endpoint unavailable from this runner; retain the last verified snapshot."
      - name: Commit refreshed official quote
        run: |
          git config user.name "aurum-signal-bot"
          git config user.email "aurum-signal-bot@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "data: refresh CMB Au99.99 quote"
          git push
