name: Refresh gold market snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh COMEX minute quote
        run: node scripts/refresh-market-snapshot.js
      - name: Refresh 30-day daily and 24h intraday history
        run: node scripts/refresh-gold-history.js || echo "history refresh unavailable; retain prior series."
      - name: Try to refresh CMB public quote
        run: node scripts/refresh-cmb-gold.js || echo "CMB endpoint unavailable from this runner; retain prior CMB snapshot."
      - name: Refresh intelligence and expert views when older than 6 hours
        run: |
          node -e "
            const d = require('./data/dashboard.json');
            const last = Math.min(
              new Date(d.news?.updatedAt || 0).getTime() || 0,
              new Date(d.deployment?.expertWeeklyUpdatedAt || 0).getTime() || 0
            );
            process.exit(Date.now() - last > 6 * 3600 * 1000 ? 0 : 1);
          " || { echo "intelligence still fresh (<6h)"; exit 0; }
          node scripts/refresh-gold-intelligence.js || echo "intelligence feed unavailable"
          node scripts/refresh-weekly-gold-research.js || echo "expert research feed unavailable"
          node scripts/refresh-gold-forecast.js || echo "forecast refresh unavailable"
      - name: Recompute forecast from this snapshot
        run: node scripts/refresh-gold-forecast.js
      - name: Commit refreshed market snapshot
        run: |
          git config user.name "aurum-signal-bot"
          git config user.email "aurum-signal-bot@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "data: refresh gold market snapshot"
          if git pull --rebase --autostash; then
            git push
          else
            git rebase --abort || true
            echo "concurrent update conflict; snapshot retried in next cycle"
          fi
